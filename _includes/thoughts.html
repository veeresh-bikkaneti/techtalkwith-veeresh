<section class="thoughts" id="thoughts" data-thoughts data-title="{{ page.title | strip_html | escape }}" data-page="{{ page.url | absolute_url }}">
  <h2>Add a thought</h2>
  <p class="thoughts-lead">The writing box stays shut until the code matches. A note you save shows up under this article on this browser. It is not emailed. Posting it for everyone opens GitHub, which asks you to sign in.</p>
  <ul class="thoughts-list" data-thoughts-list></ul>
  <form class="thoughts-form" method="post" action="" data-thoughts-form novalidate>
    <input class="thoughts-honey" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="thoughts-gate" data-thoughts-gate>
      <canvas class="thoughts-canvas" data-thoughts-canvas width="240" height="76" aria-hidden="true"></canvas>
      <label class="thoughts-label">
        Type the code
        <input class="thoughts-input" data-thoughts-code autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" inputmode="text">
      </label>
      <div class="thoughts-actions">
        <button type="button" class="thoughts-secondary" data-thoughts-refresh>New code</button>
        <button type="button" class="thoughts-primary" data-thoughts-unlock>Unlock the box</button>
      </div>
      <p class="thoughts-msg" data-thoughts-msg role="status"></p>
    </div>
    <div class="thoughts-fields" data-thoughts-fields hidden>
      <label class="thoughts-label">
        Name
        <input class="thoughts-input" name="name" required maxlength="80" autocomplete="name">
      </label>
      <label class="thoughts-label">
        Thought
        <textarea class="thoughts-input" name="message" required maxlength="2000" rows="5"></textarea>
      </label>
      <button type="submit" class="thoughts-primary">Save on this browser</button>
    </div>
  </form>
</section>
